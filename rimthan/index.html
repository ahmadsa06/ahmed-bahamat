<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ahmed Bahamat — Introduction for Rimthan</title>
<meta name="description" content="A short introduction from Ahmed Salem Bahamat — technical product manager and AI-native builder. Prepared for Rimthan: watch the video, view my CV, and explore my portfolio." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../sections.css" />
<style>
  /* ---- Intro page layout (same tokens, new composition) ---- */
  .intro-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .intro-main {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 40px var(--gutter) 48px;
    position: relative;
  }
  .intro-wrap {
    width: 100%;
    max-width: 920px;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .intro-eyebrow { margin-bottom: 22px; }
  .intro-title {
    font-size: clamp(2rem, 1.3rem + 2.6vw, 3.25rem);
    letter-spacing: -0.025em;
  }
  .intro-title .hl { color: var(--color-primary); }
  .intro-sub {
    font-size: var(--text-lg);
    color: var(--color-body);
    margin: 16px auto 0;
    max-width: 36em;
    text-wrap: pretty;
  }

  /* Video framed with the signature offset ink square */
  .video-figure {
    position: relative;
    margin: 34px auto 0;
    width: 100%;
    max-width: 660px;
  }
  .video-frame {
    position: relative;
    aspect-ratio: 16 / 9;
    background: var(--color-ink);
    border-radius: 0;
    overflow: hidden;
    z-index: 1;
    box-shadow: var(--shadow-card);
  }
  .video-frame::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translate(20px, 20px);
    border: 2px solid var(--color-primary);
    border-radius: 0;
    z-index: -1;
  }
  .video-frame iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .intro-cta {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    margin-top: 40px;
  }
  .intro-cta .btn { padding: 16px 34px; font-size: 1.0625rem; }
  .product-panel {
    margin: 34px auto 0;
    width: 100%;
  }
  .product-heading {
    color: var(--color-ink);
    font-size: clamp(1.7rem, 1.2rem + 1.8vw, 2.6rem);
    font-weight: 800;
    line-height: 1.2;
  }
  .product-actions {
    display: grid;
    gap: 18px;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
    margin: 28px auto 0;
    max-width: 100%;
  }
  .product-actions .btn {
    min-height: 76px;
    padding: 18px 28px;
    font-size: clamp(1rem, .9rem + .45vw, 1.35rem);
    font-weight: 700;
    white-space: nowrap;
  }
  .product-button {
    cursor: pointer;
    font-family: inherit;
  }
  .product-button[aria-disabled="true"] {
    cursor: default;
  }
  .product-button[aria-disabled="true"]:hover {
    background: transparent;
    color: var(--color-primary);
  }
  .support-actions {
    margin-top: 34px;
  }

  .intro-foot {
    text-align: center;
    padding: 0 var(--gutter) 40px;
    font-size: var(--text-sm);
    color: var(--color-muted);
  }
  .intro-foot a { color: var(--color-ink-soft); font-weight: 600; }
  .intro-foot a:hover { color: var(--color-primary); }

  @media (max-width: 560px) {
    .video-frame::after { transform: translate(12px, 12px); }
    .intro-cta { gap: 12px; }
    .intro-cta .btn { width: 100%; }
    .product-actions {
      gap: 8px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .product-actions .btn {
      gap: 5px;
      min-height: 58px;
      padding: 9px 6px;
      font-size: clamp(.68rem, 2.6vw, .8rem);
      line-height: 1.15;
      white-space: normal;
    }
    .product-actions .lucide {
      height: 14px;
      width: 14px;
    }
  }
</style>
</head>
<body>
<div class="intro-page">

  <!-- Decorative dots, same vocabulary as main page -->
  <span class="dot-grid" aria-hidden="true" style="top:80px; left:-44px;"></span>
  <span class="dot-grid" aria-hidden="true" style="bottom:90px; right:-44px;"></span>
  <span class="confetti" aria-hidden="true" style="top:120px; right:18%; width:10px; height:10px; background:var(--dot-navy);"></span>
  <span class="confetti" aria-hidden="true" style="bottom:160px; left:14%; width:8px; height:8px; background:var(--dot-blue);"></span>

  <main class="intro-main">
    <div class="intro-wrap">
      <span class="eyebrow intro-eyebrow">Ahmed Bahamat · For Rimthan</span>
      <h1 class="intro-title">A quick <span class="hl">introduction</span> — then dive in.</h1>
      <p class="intro-sub">Technical product manager &amp; AI-native builder. Watch the short video below, then open my CV or explore the full portfolio.</p>

      <div class="product-panel" aria-labelledby="products-heading">
        <h2 class="product-heading" id="products-heading">Watch product demos</h2>
        <div class="product-actions" role="group" aria-label="Product videos">
          <button
            class="btn btn-primary product-button"
            type="button"
            data-video-id="PbIl9tKh89o"
            data-youtube-url="https://youtu.be/PbIl9tKh89o"
            aria-pressed="true">
            <i data-lucide="layout-grid"></i>Portfolio Demo
          </button>
          <button
            class="btn btn-outline product-button"
            type="button"
            data-video-id=""
            data-youtube-url=""
            aria-disabled="true"
            aria-pressed="false"
            title="YouTube link will be added later">
            <i data-lucide="bar-chart-3"></i>KPIs Demo
          </button>
          <button
            class="btn btn-outline product-button"
            type="button"
            data-video-id=""
            data-youtube-url=""
            aria-disabled="true"
            aria-pressed="false"
            title="YouTube link will be added later">
            <i data-lucide="list-checks"></i>All Products Demo
          </button>
        </div>
      </div>

      <div class="video-figure" id="product-video">
        <div class="video-frame">
          <!-- ▶ Replace VIDEO_ID below with your YouTube video ID -->
          <iframe
            id="intro-video"
            src="https://www.youtube-nocookie.com/embed/PbIl9tKh89o?rel=0&modestbranding=1"
            title="Ahmed Bahamat — introduction video"
            loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen></iframe>
        </div>
      </div>

      <div class="intro-cta support-actions">
        <a class="btn btn-primary" href="../files/Ahmed-Bahamat-CV.docx" download>
          <i data-lucide="download"></i>Download My CV
        </a>
        <a class="btn btn-outline" href="../index.html">
          <i data-lucide="layout-grid"></i>Visit Full Portfolio
        </a>
      </div>
    </div>
  </main>

  <footer class="intro-foot">
    © 2026 <a href="../index.html">Ahmed Bahamat</a> · Riyadh, Saudi Arabia
  </footer>
</div>

<script>
  (function () {
    var ICONS = {
      "download": '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
      "layout-grid": '<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',
      "bar-chart-3": '<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
      "list-checks": '<path d="m3 7 2 2 4-4"/><path d="m3 17 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>'
    };
    document.querySelectorAll("i[data-lucide]").forEach(function (el) {
      var inner = ICONS[el.getAttribute("data-lucide")];
      if (!inner) return;
      var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "2");
      svg.setAttribute("stroke-linecap", "round");
      svg.setAttribute("stroke-linejoin", "round");
      svg.setAttribute("class", "lucide");
      svg.setAttribute("aria-hidden", "true");
      svg.innerHTML = inner;
      el.replaceWith(svg);
    });

    var video = document.getElementById("intro-video");
    var productButtons = document.querySelectorAll(".product-button");
    productButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        var videoId = button.getAttribute("data-video-id");
        if (!video || !videoId) return;

        video.src = "https://www.youtube-nocookie.com/embed/" + videoId + "?rel=0&modestbranding=1";
        productButtons.forEach(function (item) {
          item.classList.remove("btn-primary");
          item.classList.add("btn-outline");
          item.setAttribute("aria-pressed", "false");
        });
        button.classList.remove("btn-outline");
        button.classList.add("btn-primary");
        button.setAttribute("aria-pressed", "true");
      });
    });
  })();
</script>
</body>
</html>
